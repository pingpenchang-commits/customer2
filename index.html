
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003C9D">
  <title>三久服務中心</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header img {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto 16px;
      border-radius: 8px;
    }

    .header h1 {
      color: #003C9D;
      font-size: 28px;
      margin: 12px 0;
    }

    .header p {
      color: #666;
      margin: 0;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 14px rgba(0, 40, 100, 0.08);
    }

    .panel h2 {
      color: #003C9D;
      font-size: 21px;
      text-align: center;
      margin: 0 0 20px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      margin: 0 0 12px;
      padding: 12px 16px;
      border: 1px solid #003C9D;
      border-radius: 8px;
      background: #003C9D;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .menu-button:hover {
      background: #002b70;
      transform: translateY(-1px);
    }

    .menu-button:focus-visible,
    .footer-link:focus-visible {
      outline: 3px solid #f4b400;
      outline-offset: 3px;
    }

    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 24px;
      padding: 20px;
      background: #fff;
      border-top: 1px solid #ddd;
      border-radius: 8px;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #003C9D;
      font-weight: bold;
      text-decoration: none;
    }

    .footer-link img {
      display: block;
      width: 36px;
      height: auto;
      object-fit: contain;
    }

    .footer-link .suncue-logo {
      width: 110px;
    }

    .copyright {
      margin-top: 16px;
      color: #777;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px;
      }

      .panels {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .footer {
        gap: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <a href="https://line.me/" target="_blank"
         rel="noopener noreferrer" aria-label="LINE">
        <img
          src="https://i.ibb.co/DPkSnSPH/logo.jpg"
          alt="三久品牌標誌"
        >
      </a>

      <h1>三久服務中心</h1>
      <p>客戶服務與經銷商專區</p>
    </header>

    <div class="panels">
      <!-- 客戶端 -->
      <section class="panel">
        <h2>客戶服務專區</h2>

        <a class="menu-button"
           href="https://liff.line.me/2011256691-2xjeJiKc">
          我的三久
        </a>

        <a class="menu-button"
           href="https://line.me/ti/p/Ye9Glgfsea"
           target="_blank" rel="noopener noreferrer">
          LINE 叫修
        </a>

        <a class="menu-button"
           href="tel:0932606136">
          電話叫修
        </a>
      </section>

      <!-- 經銷商端 -->
      <section class="panel">
        <h2>經銷商專區</h2>

        <a class="menu-button"
           href="https://liff.line.me/2011840923-JULHRr3D">
          客戶查詢
        </a>

        <a class="menu-button"
           href="https://line.me/ti/p/xvyN_puK5u"
           target="_blank" rel="noopener noreferrer">
          LINE 業務浩軒
        </a>

        <a class="menu-button"
           href="https://suncue.tw/upload/web/PDF/solar_DM.pdf"
           target="_blank" rel="noopener noreferrer">
          電子型錄
        </a>

        <a class="menu-button"
           href="https://www.youtube.com/@solarsuncue/videos"
           target="_blank" rel="noopener noreferrer">
          三久 YouTube
        </a>

        <a class="menu-button"
           href="tel:0423397171">
          打給公司
        </a>
      </section>
    </div>

    <!-- 頁尾連結 -->
    <footer class="footer">
      <a class="footer-link"
         href="https://reurl.cc/EYWlan"
         target="_blank" rel="noopener noreferrer"
         aria-label="Facebook">
        <img
          src="https://i.ibb.co/Q3GkgjcX/facboo1.png"
          alt="Facebook"
        >
        Facebook
      </a>

      <a class="footer-link"
         href="https://www.39-suncue.com.tw/"
         target="_blank" rel="noopener noreferrer">
        <img
          src="https://i.ibb.co/XrMsMRdL/Sun.png"
          alt="三久官網圖示"
        >
        官網
      </a>

      <a class="footer-link"
         href="https://www.suncue.tw/"
         target="_blank" rel="noopener noreferrer">
        <img
          class="suncue-logo"
          src="https://i.ibb.co/zWpPKR2w/SUNCUE.png"
          alt="SUNCUE"
        >
      </a>
    </footer>

    <p class="copyright">
      三久股份有限公司｜客戶服務與經銷商專區
    </p>
  </main>
</body>
</html>
