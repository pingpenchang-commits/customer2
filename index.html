/* =====================================================
   LIFF 初始化與分享
===================================================== */

async function startShare() {

    const status = document.getElementById("status");

    try {

        status.innerText = "正在初始化 LINE...";

        await liff.init({
            liffId: LIFF_ID
        });

        console.log("LIFF 初始化成功");

        /* 檢查登入狀態 */

        if (!liff.isLoggedIn()) {

            status.innerText = "正在前往 LINE 登入...";

            liff.login();

            return;
        }

        /* 檢查分享功能 */

        const shareAvailable =
            liff.isApiAvailable("shareTargetPicker");

        console.log("LIFF 執行環境：", {
            inClient: liff.isInClient(),
            loggedIn: liff.isLoggedIn(),
            shareAvailable: shareAvailable,
            lineVersion: liff.getLineVersion()
        });

        if (!shareAvailable) {

            status.innerText =
                "目前環境不支援 LINE 分享。\n\n" +
                "請確認 LIFF 設定，並嘗試在 LINE App 中開啟。";

            return;
        }

        /* 開啟分享對象選擇器 */

        status.innerText = "正在開啟分享對象選擇器...";

        const result = await liff.shareTargetPicker([
            flexMessage
        ]);

        /* 使用者取消分享 */

        if (!result) {

            status.innerText = "已取消分享";

            return;
        }

        /* 分享完成 */

        status.innerText = "分享成功！";

        console.log("分享成功");

        /* 分享完成後關閉 LIFF */

        if (liff.isInClient()) {

            setTimeout(function () {
                liff.closeWindow();
            }, 800);

        }

    } catch (error) {

        console.error("LIFF 分享錯誤：", error);

        status.innerText =
            "LINE 分享發生錯誤：\n" +
            (error.message || String(error));

        alert(
            "LINE 分享發生錯誤：\n\n" +
            (error.message || String(error))
        );

    }

}


/* =====================================================
   啟動程式
===================================================== */

startShare();
