<body>

        font-family:sans-serif;
    ">
        <h2>正在開啟 LINE 分享...</h2>
        <p id="status">請稍候</p>

<script>

===================================================== */

const LIFF_ID = "2011840923-RM2m3qP7";

/* =====================================================
   LINE Flex Message
   以第一段 JSON 的版面為主
===================================================== */

    type: "flex",
    altText: "三久客戶端登錄｜我的三久｜LINE 叫修｜電話叫修",

    contents: {
        type: "bubble",

        /* 品牌主視覺 */

            type: "image",
            url: "https://i.ibb.co/DPkSnSPH/logo.jpg",
            size: "full",
            aspectRatio: "60:11",
            aspectMode: "cover",
            gravity: "center",
            action: {
                type: "uri",
                label: "前往 LINE",
                uri: "https://line.me/"
            }
        },

        /* 主要功能按鈕 */
        body: {
            type: "box",
            layout: "vertical",
            spacing: "none",
            contents: [

                {
                    type: "button",
                    action: {
                        type: "uri",
                        label: "我的三久",
                        uri: "https://liff.line.me/2011256691-2xjeJiKc"
                    },
                    style: "primary",
                    color: "#003C9D",
                    height: "md"
                },

                {
                    type: "box",
                    layout: "vertical",
                    contents: [],
                    height: "10px"
                },

                {
                    type: "button",
                    action: {
                        type: "uri",
                        label: "LINE 叫修",
                        uri: "https://line.me/ti/p/Ye9Glgfsea"
                    },
                    style: "primary",
                    color: "#003C9D",
                    height: "md"
                },

                {
                    type: "box",
                    layout: "vertical",
                    contents: [],
                    height: "10px"
                },

                {
                    type: "button",
                    action: {
                        type: "uri",
                        label: "電話 叫修",
                        uri: "tel:0932606136"
                    },
                    style: "primary",
                    color: "#003C9D",
                    height: "md"
                }
            ]
        },

        /* 頁尾功能 */
        footer: {
            footer: {
    type: "box",
    layout: "horizontal",
    contents: [
        /* Facebook 圖片 */
        {
            type: "box",
            layout: "horizontal",
            contents: [
                {
                    type: "image",
                    url: "https://i.ibb.co/Q3GkgjcX/facboo1.png",
                    size: "xs",
                    aspectMode: "fit",
                    align: "start",
                    offsetBottom: "10px",
                    gravity: "top",
                    action: {
                        type: "uri",
                        label: "Facebook",
                        uri: "https://reurl.cc/EYWlan"
                    }
                }
            ],
            height: "60px",
            flex: 1
        },

        /* 官網圖示與文字 */
        {
            type: "box",
            layout: "horizontal",
            contents: [
                {
                    type: "image",
                    url: "https://i.ibb.co/XrMsMRdL/Sun.png",
                    size: "xxs",
                    aspectMode: "fit",
                    align: "start",
                    gravity: "center",
                    action: {
                        type: "uri",
                        label: "官網",
                        uri: "https://www.39-suncue.com.tw/"
                    }
                },
                {
                    type: "text",
                    text: "官網",
                    weight: "bold",
                    align: "start",
                    gravity: "center",
                    size: "lg",
                    action: {
                        type: "uri",
                        label: "官網",
                        uri: "https://www.39-suncue.com.tw/"
                    }
                }
            ],
            offsetEnd: "16px",
            flex: 2
        },

        /* SUNCUE Logo */
        {
            type: "box",
            layout: "vertical",
            contents: [
                {
                    type: "image",
                    url: "https://i.ibb.co/zWpPKR2w/SUNCUE.png",
                    size: "md",
                    aspectMode: "fit",
                    offsetBottom: "25px",
                    offsetEnd: "10px",
                    gravity: "top",
                    action: {
                        type: "uri",
                        label: "SUNCUE 官網",
                        uri: "https://www.suncue.tw/"
                    }
                }
            ],
            width: "120px",
            flex: 2,
            offsetBottom: "5px"
        }
    ],
    spacing: "xs",
    height: "60px"
},
styles: {
    footer: {
        separatorColor: "#DDDDDD",
        separator: true
    }
}
    }
};

/* =====================================================
   LIFF 初始化與分享流程
===================================================== */

async function startShare() {
    const status = document.getElementById("status");

    try {
        status.innerText = "正在初始化 LINE...";

        await liff.init({
            liffId: LIFF_ID
        });

        /* 確認是否登入 */
        if (!liff.isLoggedIn()) {
            status.innerText = "正在前往 LINE 登入...";
            liff.login();
            return;
        }

        /* 確認分享功能是否可用 */
        if (!liff.isApiAvailable("shareTargetPicker")) {
            status.innerText =
                "目前環境不支援 LINE 分享，請在 LINE 中開啟。";
            return;
        }

        status.innerText = "正在開啟分享對象選擇器...";

        const result = await liff.shareTargetPicker([
            flexMessage
        ]);

        /* 使用者取消分享 */
        if (!result) {
            status.innerText = "已取消分享";
            return;
        }

        /* 分享完成 */
        status.innerText = "分享成功！";

        /* 分享完成後關閉 LIFF 視窗 */
        if (liff.isInClient()) {
            setTimeout(() => {
                liff.closeWindow();
            }, 800);
        }

    } catch (error) {
        console.error("LIFF 分享錯誤：", error);

        status.innerText = "分享發生錯誤，請重新嘗試。";

        alert(
            "LINE 分享發生錯誤：\n\n" +
            (error.message || String(error))
        );
    }
}

/* 啟動 */
startShare();
</script>
</body>
</html>
